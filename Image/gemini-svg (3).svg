<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ledHalo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="dieGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .signal-cyan {
      stroke-dasharray: 16 140;
      animation: flowOut 3.2s linear infinite;
    }
    .signal-orange {
      stroke-dasharray: 14 140;
      animation: flowOut 2.8s linear infinite;
    }
    .signal-red-right {
      stroke-dasharray: 16 140;
      animation: flowOut 2.4s linear infinite;
    }
    .signal-left {
      stroke-dasharray: 16 140;
      animation: flowLeft 2.8s linear infinite;
    }
    .bus-fast {
      stroke-dasharray: 6 12;
      animation: busTick 0.9s linear infinite;
    }
    .reg-bar-1 {
      animation: regLoad1 1.4s steps(4) infinite;
    }
    .reg-bar-2 {
      animation: regLoad2 1.1s steps(3) infinite;
    }
    .reg-bar-3 {
      animation: regLoad3 1.7s steps(5) infinite;
    }
    .status-led {
      animation: ledPulse 1.2s ease-in-out infinite;
    }
    .ext-led-glow {
      animation: extLedGlow 2.4s ease-in-out infinite;
    }
    .ext-led-halo {
      animation: extLedHalo 2.4s ease-in-out infinite;
    }
    .die-ring {
      animation: ringBreathe 2.6s ease-in-out infinite;
    }

    @keyframes flowOut {
      to { stroke-dashoffset: -156; }
    }
    @keyframes flowLeft {
      to { stroke-dashoffset: 156; }
    }
    @keyframes busTick {
      to { stroke-dashoffset: -18; }
    }
    @keyframes regLoad1 {
      0%, 100% { width: 10px; }
      50% { width: 22px; }
    }
    @keyframes regLoad2 {
      0%, 100% { width: 20px; }
      50% { width: 8px; }
    }
    @keyframes regLoad3 {
      0%, 100% { width: 14px; }
      50% { width: 24px; }
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @keyframes extLedGlow {
      0%, 100% { fill: #7F1D1D; stroke: #EF4444; stroke-opacity: 0.6; }
      45%, 55% { fill: #FF2A2A; stroke: #FCA5A5; stroke-opacity: 1; }
    }
    @keyframes extLedHalo {
      0%, 100% { opacity: 0; r: 6; }
      45%, 55% { opacity: 0.9; r: 16; }
    }
    @keyframes ringBreathe {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.95; }
    }
  </style>

  
  <g transform="translate(860, 130)">
    
    <circle cx="0" cy="0" r="105" fill="url(#dieGlow)" />

    
    <g stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <path d="M -52 -16 L -150 -16" />
      <path d="M -52 0 L -150 0" />
      <path d="M -52 16 L -150 16" />

      
      <path d="M 52 -16 L 150 -16" />
      <path d="M 52 0 L 150 0" />
      <path d="M 52 16 L 150 16" />

      
      <path d="M -16 -52 L -16 -86 L 16 -86 L 16 -52" />
      <path d="M 0 -52 L 0 -98" />
      <path d="M -16 52 L -16 86 L 16 86 L 16 52" />
      <path d="M 0 52 L 0 98" />
    </g>

    
    <g fill="none" stroke-width="2.2" stroke-linecap="round" filter="url(#pulseGlow)">
      
      <path d="M -52 -16 L -150 -16" stroke="#FF6B00" class="signal-left" />
      <path d="M -52 0 L -150 0" stroke="#38BDF8" class="signal-left" />
      <path d="M -52 16 L -150 16" stroke="#FF6B00" class="signal-left" />

      
      <path d="M 52 -16 L 150 -16" stroke="#38BDF8" class="signal-cyan" />
      <path d="M 52 0 L 150 0" stroke="#FF2A2A" class="signal-red-right" />
      <path d="M 52 16 L 150 16" stroke="#38BDF8" class="signal-cyan" />
    </g>

    
    <g transform="translate(-218, -26)">
      <rect x="0" y="0" width="68" height="52" rx="4" fill="#0B131E" stroke="#FF6B00" stroke-opacity="0.8" stroke-width="1.4" />
      <text x="34" y="22" fill="#FF6B00" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">UART</text>
      <text x="34" y="37" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">TX • RX</text>
    </g>

    
    <g transform="translate(162, 0)">
      <circle cx="0" cy="0" r="14" fill="#FF2A2A" class="ext-led-halo" filter="url(#ledHalo)" />
      <circle cx="0" cy="0" r="8" stroke-width="1.4" class="ext-led-glow" />
      <text x="0" y="24" fill="#94A3B8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">LED</text>
    </g>

    
    <circle cx="0" cy="-98" r="3.5" fill="#0d1117" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="0" cy="98" r="3.5" fill="#0d1117" stroke="#FF6B00" stroke-width="1.8" />

    
    <g stroke="#94A3B8" stroke-width="2">
      
      <line x1="-28" y1="-52" x2="-28" y2="-44" /><line x1="-16" y1="-52" x2="-16" y2="-44" />
      <line x1="-4" y1="-52" x2="-4" y2="-44" /><line x1="8" y1="-52" x2="8" y2="-44" />
      <line x1="20" y1="-52" x2="20" y2="-44" /><line x1="32" y1="-52" x2="32" y2="-44" />
      <line x1="-28" y1="44" x2="-28" y2="52" /><line x1="-16" y1="44" x2="-16" y2="52" />
      <line x1="-4" y1="44" x2="-4" y2="52" /><line x1="8" y1="44" x2="8" y2="52" />
      <line x1="20" y1="44" x2="20" y2="52" /><line x1="32" y1="44" x2="32" y2="52" />
      
      <line x1="-52" y1="-28" x2="-44" y2="-28" /><line x1="-52" y1="-16" x2="-44" y2="-16" />
      <line x1="-52" y1="-4" x2="-44" y2="-4" /><line x1="-52" y1="8" x2="-44" y2="8" />
      <line x1="-52" y1="20" x2="-44" y2="20" /><line x1="-52" y1="30" x2="-44" y2="30" />
      <line x1="44" y1="-28" x2="52" y2="-28" /><line x1="44" y1="-16" x2="52" y2="-16" />
      <line x1="44" y1="-4" x2="52" y2="-4" /><line x1="44" y1="8" x2="52" y2="8" />
      <line x1="44" y1="20" x2="52" y2="20" /><line x1="44" y1="30" x2="52" y2="30" />
    </g>

    
    <rect x="-44" y="-44" width="88" height="88" rx="6" fill="#0B131E" stroke="#94A3B8" stroke-width="2" />
    <rect x="-37" y="-37" width="74" height="74" rx="4" fill="#070D14" stroke="#38BDF8" stroke-width="1.2" class="die-ring" />

    
    <g stroke="#38BDF8" stroke-opacity="0.45" stroke-width="0.9">
      <line x1="-37" y1="-22" x2="-28" y2="-22" /><line x1="-37" y1="0" x2="-28" y2="0" /><line x1="-37" y1="22" x2="-28" y2="22" />
      <line x1="37" y1="-22" x2="28" y2="-22" /><line x1="37" y1="0" x2="28" y2="0" /><line x1="37" y1="22" x2="28" y2="22" />
      <line x1="-20" y1="-37" x2="-20" y2="-28" /><line x1="20" y1="-37" x2="20" y2="-28" />
      <line x1="-20" y1="37" x2="-20" y2="28" /><line x1="20" y1="37" x2="20" y2="28" />
    </g>

    
    <rect x="-28" y="-28" width="26" height="24" rx="2" fill="#0E2238" stroke="#38BDF8" stroke-width="1" />
    <text x="-15" y="-18" fill="#38BDF8" font-family="monospace" font-size="6.5" font-weight="bold" text-anchor="middle">ALU</text>
    <rect x="-24" y="-14" width="14" height="2.2" rx="1" fill="#38BDF8" class="reg-bar-1" />
    <rect x="-24" y="-10" width="18" height="2.2" rx="1" fill="#FF6B00" class="reg-bar-2" />

    
    <rect x="4" y="-28" width="24" height="24" rx="2" fill="#1E1610" stroke="#FF6B00" stroke-width="1" />
    <text x="16" y="-18" fill="#FF6B00" font-family="monospace" font-size="6" font-weight="bold" text-anchor="middle">MEM</text>
    <rect x="7" y="-14" width="16" height="2.2" rx="1" fill="#FFFFFF" class="reg-bar-3" />
    <rect x="7" y="-10" width="12" height="2.2" rx="1" fill="#FF6B00" class="reg-bar-1" />

    
    <line x1="-2" y1="-16" x2="4" y2="-16" stroke="#FFFFFF" stroke-width="1.5" class="bus-fast" />
    <line x1="-15" y1="-4" x2="-15" y2="6" stroke="#38BDF8" stroke-width="1.5" class="bus-fast" />
    <line x1="16" y1="-4" x2="16" y2="6" stroke="#FF6B00" stroke-width="1.5" class="bus-fast" />
    <line x1="-22" y1="6" x2="22" y2="6" stroke="#38BDF8" stroke-width="1.5" class="bus-fast" />

    
    <rect x="-28" y="10" width="56" height="18" rx="2" fill="#0B192C" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="0.9" />
    <path d="M -22 22 L -18 22 L -18 15 L -13 15 L -13 22 L -8 22 L -8 15 L -3 15 L -3 22 L 2 22" stroke="#38BDF8" stroke-width="1.2" fill="none" />
    <text x="16" y="21" fill="#94A3B8" font-family="monospace" font-size="6" text-anchor="middle">72MHz</text>

    
    <circle cx="24" cy="14" r="2" fill="#FF6B00" class="status-led" filter="url(#pulseGlow)" />
  </g>

  
  <g transform="translate(75, 118)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5">Vivek</text>
    <text x="2" y="36" fill="#94A3B8" font-family="&#39;Fira Code&#39;, monospace" font-size="17" font-weight="500">Embedded Software Engineer  |  Karnataka, India</text>
    <rect x="2" y="52" width="110" height="3" rx="1.5" fill="#FF6B00" />
    <rect x="120" y="52" width="45" height="3" rx="1.5" fill="#38BDF8" />
  </g>
</svg>
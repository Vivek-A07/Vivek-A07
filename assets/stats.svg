
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .underline, .lang-bar { transform-origin: left center; }
  </style>
  <defs>
    <linearGradient id="sleek-stats-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#1a1a1e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sleek-stats-bg)" rx="14" ry="14"/>

  <!-- corner decorations (mirrors sleek-header) -->
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#ba2626"/>
    <rect x="40" y="42" width="2" height="22" fill="#ba2626"/>
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#ba2626"/>
      <rect x="40" y="42" width="2" height="22" fill="#ba2626"/>
    </g>
  </g>

  <!-- heading + accent underline -->
  <text class="heading" x="48" y="84" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="36" font-weight="700" letter-spacing="-1.2">Activity.</text>
  <rect class="underline" x="48" y="96" width="181" height="2" fill="#ba2626" rx="1"/>

  <!-- meta line -->
  <text class="meta" x="48" y="120" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">@GITHUB-USER   ·   — CONTRIBUTIONS   ·   NOT LOADED</text>

  <!-- stat blocks -->
  <g transform="translate(48 156)">
      <g class="stat s0">
        <text x="0" y="0" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REPOS</text>
        <text x="0" y="38" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">—</text>
        <text x="0" y="60" fill="#9d9daa" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">load github</text>
      </g>
    </g>
  <g transform="translate(230 156)">
      <g class="stat s1">
        <text x="0" y="0" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMITS</text>
        <text x="0" y="38" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">—</text>
        <text x="0" y="60" fill="#9d9daa" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
      </g>
    </g>
  <g transform="translate(412 156)">
      <g class="stat s2">
        <text x="0" y="0" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PRS</text>
        <text x="0" y="38" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">—</text>
        <text x="0" y="60" fill="#9d9daa" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">authored</text>
      </g>
    </g>
  <g transform="translate(594 156)">
      <g class="stat s3">
        <text x="0" y="0" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REVIEWS</text>
        <text x="0" y="38" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">—</text>
        <text x="0" y="60" fill="#9d9daa" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
      </g>
    </g>

  <!-- language strip -->
  <rect x="48" y="254" width="704" height="6" rx="3" fill="#9d9daa" fill-opacity="0.2"/>
  <g class="lang-bar"><rect x="48" y="254" width="704" height="6" rx="3" fill="#ba2626" fill-opacity="0.18"/></g>
  <text x="48" y="286" fill="#9d9daa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" fill-opacity="0.7">LOAD GITHUB STATS TO POPULATE</text>
</svg>

